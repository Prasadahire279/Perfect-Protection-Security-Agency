# ===================================================
# PERFECT PROTECTION SECURITY AGENCY - SPRING BOOT
# ===================================================

# Server Port
server.port=8080
server.servlet.context-path=/api

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/perfect_protection_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT Secret Configuration
ppsa.jwt.secret=PerfectProtectionSecurityAgency2026SecretKey_MUST_BE_256_BITS_LONG_!!
ppsa.jwt.expiration-ms=86400000

# CORS - Allow frontend to call API
ppsa.cors.allowed-origins=http://localhost:63342,http://127.0.0.1:5500,http://localhost:5500,file://

# Logging
logging.level.com.perfectprotection=DEBUG
logging.level.org.springframework.security=INFO
